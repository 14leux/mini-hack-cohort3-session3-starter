[package]
name = "mini_hack_session3"
version = "1.0.0"
edition = "2021"
description = "Cohort 3 Session 3 starter (Rust): querying on-chain Avalanche data three ways, plus the multi-provider model layer"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rmcp = { version = "3.1.2", features = ["client", "transport-streamable-http-client-reqwest"] }
chrono = "0.4"
